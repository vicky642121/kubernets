apiVersion: v1
kind: Pod
metadata:
  name: backend-pod
  labels:
    app: backend
spec:
  hostNetwork: true
  containers:
    - name: backend-container
      image: vigneshpandianv/k8-backend:devlatest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000
      env:
        - name: DB_HOST
          value: "10.244.0.9"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "Cloud@123"
        - name: DB_NAME
          value: "k8_learning"