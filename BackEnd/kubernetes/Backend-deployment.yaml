#i moved the env variables from here to backend-config.yaml file because if i put this env variables in this deployment file then if i want to change the env variables then i need to change the deployment file and redeploy the backend pod. so that i moved this env variables to configmap file and then i can able to change the env variables without redeploying the backend pod.
# also hard to maintain if the config variables are grow.
#simply  i can put the reference of the configmap in the backend deployment file and then i can able to change the env variables in the configmap file without redeploying the backend pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # hostNetwork: true
      containers:
        - name: backend-container
          image: vigneshpandianv/k8-backend:v4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /live
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          # envFrom:
          #   - configMapRef:
          #       name: backend-config #hide because some of the data need to get from secret.yaml file so that
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_NAME
          #   - name: DB_HOST
          #     value: "pgsql-service"
          #   - name: DB_PORT
          #     value: "5432"
