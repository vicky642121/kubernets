apiVersion: batch/v1
kind: CronJob
metadata:
  name: backend-cronjob
spec:
  schedule: "* * * * *" # Runs every minute
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backend-cronjob-container
              image: busybox:latest
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "echo 'Hello from kubernetes cron job...'"]
      