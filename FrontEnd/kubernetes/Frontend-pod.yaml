apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
  labels:
    app: frontend
spec:
  containers:
    - name: frontend-container
      image: vigneshpandianv/k8-frontend
      imagePullPolicy: IfNotPresent
      tty: true
      # args: ["--","--host", "0.0.0.0"]
      ports:
        - containerPort: 5173 